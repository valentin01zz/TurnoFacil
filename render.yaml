# Render Blueprint for TurnoFacil (see docs/agentic/ADR/ADR-0002-hosting.md and docs/agentic/DEPLOYMENT.md).
# Values marked "sync: false" are asked for once, in the Render dashboard, when the Blueprint is created.
# The cron job repeats the variables it needs: Blueprint files have no shared variables or interpolation.

services:
  - type: web
    name: turnofacil-web
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: turnofacil-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: SITE_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: cron
    name: turnofacil-reminders
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_reminders
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: turnofacil-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: turnofacil-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "17"
    databaseName: turnofacil
    user: turnofacil
