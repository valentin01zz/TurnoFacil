# Lint, checks and the full test suite on every pull request and on main (AGENTS.md, rule 6).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: turnofacil
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: turnofacil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turnofacil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for the CI database only; real secrets live in Render.
      SECRET_KEY: ci-only-not-secret
      DEBUG: "false"
      SECURE_SSL_REDIRECT: "false"
      DB_NAME: turnofacil
      DB_USER: turnofacil
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput
