{% extends "base.html" %}
{% block title %}Contraseña actualizada · TurnoFacil{% endblock %}
{% block content %}
<div class="wrap">
  <div class="auth">
    <div class="card">
      <span class="icon-box" style="margin-bottom: 16px; background: var(--accent); color: var(--ink)">{% include "_icon.html" with name="check" size=26 stroke=2.8 %}</span>
      <h1>Contraseña actualizada</h1>
      <p class="sub">Ya podés ingresar con tu contraseña nueva.</p>
      <a class="btn btn-primary btn-block" href="{% url 'login' %}">Ingresar</a>
    </div>
  </div>
</div>
{% endblock %}
