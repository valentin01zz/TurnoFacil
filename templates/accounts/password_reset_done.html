{% extends "base.html" %}
{% block title %}Revisá tu email · TurnoFacil{% endblock %}
{% block content %}
<div class="wrap">
  <div class="auth">
    <div class="card">
      <span class="icon-box" style="margin-bottom: 16px">{% include "_icon.html" with name="mail" size=26 %}</span>
      <h1>Revisá tu email</h1>
      <p class="sub">Si existe una cuenta con ese email, te enviamos un link para elegir una contraseña nueva.</p>
      <a class="btn btn-quiet btn-block" href="{% url 'login' %}">Volver a ingresar</a>
    </div>
  </div>
</div>
{% endblock %}
