{% extends "base.html" %}
{% block title %}Recuperar contraseña · TurnoFacil{% endblock %}
{% block content %}
  <h1>Recuperar contraseña</h1>
  <p>Escribí el email de tu cuenta y te enviamos un link para elegir una contraseña nueva.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button class="button" type="submit">Enviar link</button>
  </form>
  <p><a href="{% url 'login' %}">Volver a ingresar</a></p>
{% endblock %}
