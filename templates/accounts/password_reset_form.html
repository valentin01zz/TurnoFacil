{% extends "base.html" %}
{% block title %}Recuperar contraseña · TurnoFacil{% endblock %}
{% block content %}
<div class="wrap">
  <div class="auth">
    <div class="card">
      <h1>Recuperar contraseña</h1>
      <p class="sub">Escribí el email de tu cuenta y te enviamos un link para elegir una contraseña nueva.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary btn-block" type="submit">Enviar link</button>
      </form>
    </div>
    <p class="alt"><a href="{% url 'login' %}">Volver a ingresar</a></p>
  </div>
</div>
{% endblock %}
