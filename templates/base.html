{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TurnoFacil{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">TurnoFacil</a>
    {% if user.is_authenticated %}
      <nav class="nav">
        <a href="{% url 'panel' %}">Panel</a>
        <a href="{% url 'service_list' %}">Servicios</a>
        <a href="{% url 'professional_list' %}">Profesionales</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="link" type="submit">Salir</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
