{% extends "base.html" %}
{% block title %}PIN nuevo · TurnoFacil{% endblock %}
{% block content %}
<div class="wrap narrow">
  <h1 class="page-title">Elegí tu PIN nuevo de dueño</h1>
  <p class="page-lead">Entre 4 y 6 números. El PIN anterior deja de funcionar.</p>
  <div class="card">
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_div }}
      <button class="btn btn-primary" type="submit">Guardar PIN</button>
    </form>
  </div>
</div>
{% endblock %}
