<ul class="items">
  {% for row in rows %}
    <li class="item" style="display: block">
      <div class="rank-head">
        <strong>{{ row.name }}</strong>
        <span class="nowrap"><strong>$&nbsp;{{ row.income|floatformat:"0g" }}</strong></span>
      </div>
      <div class="helptext">{{ row.count }} turno{{ row.count|pluralize }} · {{ row.attended }} asisti{{ row.attended|pluralize:"ó,eron" }}</div>
      <div class="rank-bar" aria-hidden="true"><i style="width: {{ row.width }}%"></i></div>
    </li>
  {% endfor %}
</ul>
